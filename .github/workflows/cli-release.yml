name: CLI release

on:
  workflow_dispatch:
  push:
    tags: ['cli-v*']

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install git-filter-repo==2.47.0
      - run: pnpm install --frozen-lockfile
      - run: node packages/cli/scripts/pack.mjs
      - run: node --test packages/cli/test/*.test.mjs
      - run: node packages/cli/scripts/build-native.mjs
      - name: Verify executable outside the checkout
        shell: bash
        run: |
          RIVET_BINARY=$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name 'rivet-v*' ! -name '*.sha256' | head -n 1)
          cd "$RUNNER_TEMP"
          "$RIVET_BINARY" --version
          "$RIVET_BINARY" --help
          "$RIVET_BINARY" keygen --out "$RUNNER_TEMP/release-owner.pem"
          cd "$GITHUB_WORKSPACE"
          RIVET_TEST_BINARY="$RIVET_BINARY" node --test packages/cli/test/package.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rivet-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/rivet-v*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: rivet-npm
          path: dist/rivet-cli-*.tgz*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/cli-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish versioned release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "Rivet $GITHUB_REF_NAME" --notes-file packages/cli/RELEASE_NOTES.md --prerelease
