packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  core-js: true
  esbuild: false
  msgpackr-extract: true
  netlify-cli: false
  prisma: true
  sharp: false
  unix-dgram: false
  workerd: true
patchedDependencies:
  '@ckb-ccc/connector@2.2.2': patches/@ckb-ccc__connector@2.2.2.patch
  '@nervosnetwork/ckb-sdk-utils@0.109.5': patches/@nervosnetwork__ckb-sdk-utils@0.109.5.patch
overrides:
  # Rivet uses browser WebRTC. The React Native adapter and its Metro toolchain are unused.
  '@libp2p/webrtc>react-native-webrtc': '-'
  postcss@<8.5.23: 8.5.23
  source-map-js@<1.2.2: 1.2.2
  shell-quote@<1.11.0: 1.11.0
  follow-redirects@<1.16.2: 1.16.2
  sharp@<0.35.5: 0.35.5
  zod@<4.6.6: 4.6.6
  '@joyid/common>abitype': 1.3.0
  # Security fixes for the deployment CLIs and their build/dev servers.
  '@fastify/busboy@<3.2.2': 3.2.2
  ajv@>=7.0.0-alpha.0 <8.18.0: 8.18.0
  body-parser@>=2.0.0 <2.4.0: 2.4.0
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  fast-uri@>=4.0.0 <4.2.3: 4.2.3
  fastify@>=5.12.2 <5.12.6: 5.12.6
  glob@>=9.0.0 <14.0.2: 14.0.2
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  minimatch@>=7.0.0 <11.0.1: 11.0.1
  path-to-regexp@>=4.0.0 <6.3.0: 6.3.0
  path-to-regexp@>=8.0.0 <8.4.0: 8.4.0
  qs@>=6.7.0 <6.16.1: 6.16.1
  smol-toml@<1.9.0: 1.9.0
  tar@<7.5.21: 7.5.21
  undici@<6.29.1: 6.29.1
  undici@>=7.0.0 <7.30.1: 7.30.1
  # The SDK patch replaces elliptic ECPair signing with Noble.
  '@nervosnetwork/ckb-sdk-utils>elliptic': '-'
packageExtensions:
  '@nervosnetwork/ckb-sdk-utils@0.109.5':
    dependencies:
      '@noble/curves': 2.4.0
minimumReleaseAgeExclude:
  - '@vercel/cli-support@66.6.0'
  - '@vercel/next@31.0.2'
  - '@vercel/vc-native-darwin-arm64@66.6.0'
  - '@vercel/vc-native-darwin-x64@66.6.0'
  - '@vercel/vc-native-linux-arm64-musl@66.6.0'
  - '@vercel/vc-native-linux-arm64@66.6.0'
  - '@vercel/vc-native-linux-x64-musl@66.6.0'
  - '@vercel/vc-native-linux-x64@66.6.0'
  - '@vercel/vc-native-win32-arm64@66.6.0'
  - '@vercel/vc-native-win32-x64@66.6.0'
  - vercel@66.6.0
